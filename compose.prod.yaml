services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-coach}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-coachpass}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - coach_net

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      API_BASE_URL: http://api:8000
      PUBLIC_BASE_URL: https://${DEPLOY_DOMAIN:-aicareercoach.alexklyvibe.ru}
      KWORK_STORAGE_STATE: /secrets/kwork_storage.json
      FLRU_STORAGE_STATE: /secrets/flru_storage.json
      YANDEX_STORAGE_STATE: /secrets/yandex_storage.json
      TELEGRAM_SESSION_PATH: /secrets/telegram.session.txt
      KWORK_CATEGORY_IDS: "11,113,45,41"
      YANDEX_LISTING_URL: "https://uslugi.yandex.ru/cab/orders?max_reactions_count=10&type=new"
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - coach_net

  worker:
    build: .
    command: python -m app.worker
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      MONGO_HOST: mongo
      API_BASE_URL: http://api:8000
      KWORK_STORAGE_STATE: /secrets/kwork_storage.json
      FLRU_STORAGE_STATE: /secrets/flru_storage.json
      YANDEX_STORAGE_STATE: /secrets/yandex_storage.json
      TELEGRAM_SESSION_PATH: /secrets/telegram.session.txt
      KWORK_CATEGORY_IDS: "11,113,45,41"
      YANDEX_LISTING_URL: "https://uslugi.yandex.ru/cab/orders?max_reactions_count=10&type=new"
    volumes:
      - ./secrets:/secrets:ro
    depends_on:
      - api
    networks:
      - coach_net

  bot:
    build: .
    command: python -m bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: production
      MONGO_HOST: mongo
      API_BASE_URL: http://api:8000
      TELEGRAM_USE_WEBHOOK: "false"
    depends_on:
      - api
    networks:
      - coach_net

  streamlit:
    build: .
    command: >-
      streamlit run frontend/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.headless=true
      --browser.gatherUsageStats=false
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      API_PREFIX: /api/v1
    depends_on:
      - api
    networks:
      - coach_net

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DEPLOY_DOMAIN: ${DEPLOY_DOMAIN:-aicareercoach.alexklyvibe.ru}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - streamlit
    networks:
      - coach_net

networks:
  coach_net:

volumes:
  mongo_data:
  caddy_data:
  caddy_config:
