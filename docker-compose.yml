services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-coach}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-coachpass}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: 27017
      API_BASE_URL: http://api:8000
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: python -m app.worker
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_HOST: mongo
      API_BASE_URL: http://api:8000
    depends_on:
      - api

  bot:
    build: .
    command: python -m bot.main
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_HOST: mongo
      API_BASE_URL: http://api:8000
      TELEGRAM_USE_WEBHOOK: "false"
    depends_on:
      - api

  streamlit:
    build: .
    command: streamlit run frontend/app.py --server.address=0.0.0.0 --server.port=8501
    restart: unless-stopped
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      API_PREFIX: /api/v1
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  mongo_data:
